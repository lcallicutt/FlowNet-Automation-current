kind = "web"
previewPath = "/"
title = "FlowNet Automation"
description = "A public FlowNet website for automation, AI, remote consulting, and FlowNet Tech Care hands-on technology support serving Hampton Roads."
version = "1.0.0"
id = "artifacts/flownet-automation"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21171

[services.development]
run = "pnpm --filter @workspace/flownet-automation run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/flownet-automation", "run", "build" ]
serve = "static"
publicDir = "artifacts/flownet-automation/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21171"
BASE_PATH = "/"
